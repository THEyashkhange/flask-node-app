<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask-Node Submission Form</title>
</head>
<body>
    <h2>User Information Form</h2>
    <form id="userForm">
        <input type="text" id="name" placeholder="Enter Name" required><br><br>
        <input type="email" id="email" placeholder="Enter Email" required><br><br>
        <button type="submit">Submit</button>
    </form>
    <h3 id="response"></h3>

    <script>
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            try {
                const res = await fetch('http://localhost:5000/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });
                const data = await res.json();
                document.getElementById('response').innerText = data.message;
            } catch (err) {
                document.getElementById('response').innerText = "Error connecting to backend.";
            }
        });
    </script>
</body>
</html>
